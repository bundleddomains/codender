<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editure Lab v2</title>

<style>

:root{
--lab-bg:#0e1116;
}

html,body{
margin:0;
height:100%;
background:var(--lab-bg);
display:flex;
flex-direction:column;
font-family:system-ui,sans-serif;
overflow:hidden;
}

#bar{
display:flex;
flex-direction:column;
padding:10px 14px;
background:#151922;
border-bottom:1px solid #222;
gap:10px;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
background:#1f2630;
color:#fff;
border:1px solid #2d3642;
padding:8px 14px;
cursor:pointer;
}

button.active{
background:#00aaff;
border-color:#00aaff;
}

.layer{
background:#555;
}

.layer.active{
background:yellow;
color:#000;
}

label{
color:#aaa;
font-size:12px;
display:flex;
align-items:center;
gap:6px;
}

input[type=range]{width:160px;}

#orbit{width:100%;}

#code{
display:none;
flex:1;
width:100%;
background:#0b0f15;
color:#fff;
border:none;
padding:20px;
font-family:monospace;
font-size:14px;
box-sizing:border-box;
resize:none;
outline:none;
}

#wrap{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

.scene{
width:900px;
height:650px;
perspective:1400px;
display:flex;
align-items:center;
justify-content:center;
}

.viewer{
width:80%;
height:80%;
display:flex;
align-items:center;
justify-content:center;
transform-style:preserve-3d;
}

.panel{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:opacity .25s ease;
transform-style:preserve-3d;
}

.panel iframe{
border:none;
background:transparent;
width:100%;
height:100%;
}

</style>
</head>

<body>

<div id="bar">

<div class="row">
<button id="paste">Paste</button>
<button id="run">Run</button>
<button id="clear">Clear Layer</button>
<button id="kill">Kill</button>
<button id="toggleCode">Code</button>
</div>

<div class="row" id="layers"></div>

<div class="row">
<label>X <input type="range" id="rotX" min="-60" max="60" value="0"></label>
<label>Y <input type="range" id="rotY" min="-180" max="180" value="0"></label>
</div>

<div class="row">
<label style="width:100%">Camera Orbit
<input type="range" id="orbit" min="-180" max="180" value="0">
</label>
</div>

</div>

<textarea id="code" placeholder="paste code here"></textarea>

<div id="wrap">
<div class="scene">
<div class="viewer" id="viewer">
<div class="panel" id="panel">
<iframe id="pv" sandbox="allow-scripts allow-same-origin"></iframe>
</div>
</div>
</div>
</div>

<script>

const codeEl=document.getElementById("code")
const panel=document.getElementById("panel")
const rotX=document.getElementById("rotX")
const rotY=document.getElementById("rotY")
const orbit=document.getElementById("orbit")
const viewer=document.getElementById("viewer")
const toggleCodeBtn=document.getElementById("toggleCode")
const wrap=document.getElementById("wrap")

function iframe(){return document.getElementById("pv")}

let currentLayer=1
let layers={}
let layerTransforms={}

for(let i=1;i<=8;i++){
layers[i]=""
layerTransforms[i]={x:0,y:0}
}

const layerWrap=document.getElementById("layers")

for(let i=1;i<=8;i++){
const b=document.createElement("button")
b.textContent=i
b.className="layer"+(i===1?" active":"")
b.onclick=()=>selectLayer(i)
layerWrap.appendChild(b)
}

function selectLayer(n){

currentLayer=n

document.querySelectorAll(".layer").forEach(b=>b.classList.remove("active"))
layerWrap.children[n-1].classList.add("active")

codeEl.value=layers[n]||""

rotX.value=layerTransforms[n].x
rotY.value=layerTransforms[n].y

}

function run(){

layers[currentLayer]=codeEl.value
renderLayers()

panel.style.opacity="1"
panel.style.pointerEvents="auto"

}

function renderLayers(){

let html=`<!doctype html>
<html>
<head>
<style>
body{
margin:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
overflow:hidden;
}
#grid{
position:absolute;
inset:0;
pointer-events:none;
}
#stage{
position:relative;
transform-style:preserve-3d;
}
</style>
</head>
<body>

<canvas id="grid"></canvas>

<div id="stage">
`

for(let i=1;i<=8;i++){

if(layers[i]){

const t=layerTransforms[i]

html+=`
<div style="
position:absolute;
transform:rotateX(${t.x}deg) rotateY(${t.y}deg);
transform-style:preserve-3d;
">
${layers[i]}
</div>
`

}

}

html+=`

</div>

<script>

const g=document.getElementById("grid")
const ctx=g.getContext("2d")

function draw(){

g.width=window.innerWidth
g.height=window.innerHeight

let grid=50

ctx.strokeStyle="#1b2430"

for(let x=0;x<g.width;x+=grid){
ctx.beginPath()
ctx.moveTo(x,0)
ctx.lineTo(x,g.height)
ctx.stroke()
}

for(let y=0;y<g.height;y+=grid){
ctx.beginPath()
ctx.moveTo(0,y)
ctx.lineTo(g.width,y)
ctx.stroke()
}

ctx.strokeStyle="#00ffaa"
ctx.lineWidth=2

ctx.beginPath()
ctx.moveTo(g.width/2,0)
ctx.lineTo(g.width/2,g.height)
ctx.stroke()

ctx.beginPath()
ctx.moveTo(0,g.height/2)
ctx.lineTo(g.width,g.height/2)
ctx.stroke()

}

draw()
window.onresize=draw

<\/script>

</body>
</html>
`

iframe().srcdoc=html

}

function clearLayer(){
layers[currentLayer]=""
codeEl.value=""
renderLayers()
}

function kill(){
iframe().srcdoc=""
}

rotX.oninput=()=>{
layerTransforms[currentLayer].x=rotX.value
renderLayers()
}

rotY.oninput=()=>{
layerTransforms[currentLayer].y=rotY.value
renderLayers()
}

orbit.oninput=()=>{
viewer.style.transform=\`rotateY(\${orbit.value}deg)\`
}

toggleCodeBtn.onclick=()=>{

if(codeEl.style.display==="none"){
codeEl.style.display="block"
wrap.style.display="none"
}else{
codeEl.style.display="none"
wrap.style.display="flex"
}

}

document.getElementById("run").onclick=run
document.getElementById("clear").onclick=clearLayer
document.getElementById("kill").onclick=kill

</script>

</body>
</html>
