<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editure Lab</title>

<style>

:root{
--lab-bg:#0e1116;
--bar-normal:#151922;
--bar-code:#0b3d91;
}

html,body{
margin:0;
height:100%;
background:var(--lab-bg);
display:flex;
flex-direction:column;
font-family:system-ui,sans-serif;
overflow:hidden;
}

#bar{
display:flex;
flex-direction:column;
padding:10px 14px;
background:var(--bar-normal);
border-bottom:1px solid #222;
gap:10px;
transition:.2s;
}

#bar.codeMode{
background:var(--bar-code);
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
background:#1f2630;
color:#fff;
border:1px solid #2d3642;
padding:8px 14px;
cursor:pointer;
}

.layer{
background:#555;
}

.layer.active{
background:yellow;
color:#000;
}

label{
color:#aaa;
font-size:12px;
display:flex;
align-items:center;
gap:6px;
}

input[type=range]{width:160px;}

#code{
width:100%;
height:160px;
background:#0b0f15;
color:#fff;
border:none;
border-top:1px solid #222;
padding:10px;
font-family:monospace;
font-size:14px;
box-sizing:border-box;
resize:none;
display:none;
}

#wrap{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

.scene{
width:900px;
height:650px;
perspective:1400px;
display:flex;
align-items:center;
justify-content:center;
}

.viewer{
width:80%;
height:80%;
display:flex;
align-items:center;
justify-content:center;
}

.panel{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:opacity .25s ease;
transform-style:preserve-3d;
}

.panel iframe{
border:none;
background:transparent;
width:100%;
height:100%;
}

</style>
</head>

<body>

<div id="bar">

<div class="row">
<button id="paste">Paste</button>
<button id="run">Run</button>
<button id="clear">Clear Layer</button>
<button id="kill">Kill</button>
</div>

<div class="row" id="layers"></div>

<div class="row">
<label>X <input type="range" id="rotX" min="-60" max="60" value="0"></label>
<label>Y <input type="range" id="rotY" min="-180" max="180" value="0"></label>
</div>

</div>

<textarea id="code" placeholder="paste code here"></textarea>

<div id="wrap">
<div class="scene">
<div class="viewer">
<div class="panel" id="panel">
<iframe id="pv"
sandbox="allow-scripts allow-same-origin"
scrolling="no"></iframe>
</div>
</div>
</div>
</div>

<script>

/* elements */

const codeEl=document.getElementById("code")
const panel=document.getElementById("panel")
const rotX=document.getElementById("rotX")
const rotY=document.getElementById("rotY")
const bar=document.getElementById("bar")
const wrap=document.getElementById("wrap")

function iframe(){return document.getElementById("pv")}

/* layers */

let currentLayer=1
let layers={}
let layerTransforms={}

for(let i=1;i<=10;i++){
layers[i]=""
layerTransforms[i]={x:0,y:0}
}

/* layer buttons */

const layerWrap=document.getElementById("layers")

for(let i=1;i<=10;i++){

const b=document.createElement("button")
b.textContent=i
b.className="layer"+(i===1?" active":"")
b.onclick=()=>selectLayer(i)

layerWrap.appendChild(b)

}

/* layer select */

function selectLayer(n){

if(currentLayer===n){

currentLayer=null
document.querySelectorAll(".layer").forEach(b=>b.classList.remove("active"))
codeEl.value=""
return

}

currentLayer=n

document.querySelectorAll(".layer").forEach(b=>b.classList.remove("active"))
layerWrap.children[n-1].classList.add("active")

codeEl.value=layers[n]||""

rotX.value=layerTransforms[n].x
rotY.value=layerTransforms[n].y

}

/* run */

function run(){

const raw=(codeEl.value||"").trim()

layers[currentLayer]=raw

renderLayers()

panel.style.opacity="1"
panel.style.pointerEvents="auto"

}

/* render layers */

function renderLayers(){

let html=`<body style="margin:0;background:black;position:relative;">`

for(let i=1;i<=10;i++){

if(layers[i]){

const t=layerTransforms[i]

html+=`
<div style="
position:absolute;
top:50px;
left:50px;
transform:rotateX(${t.x}deg) rotateY(${t.y}deg);
transform-style:preserve-3d;
">
${layers[i]}
</div>
`

}

}

html+="</body>"

iframe().srcdoc=html

}

/* paste */

async function paste(){

const text=await navigator.clipboard.readText()

codeEl.value=text

/* auto enter code mode */

if(!codeMode){
toggleCodeMode()
}

}

/* clear */

function clearLayer(){

layers[currentLayer]=""
codeEl.value=""

renderLayers()

}

/* kill iframe */

function kill(){

const old=iframe()

const fresh=document.createElement("iframe")

fresh.id="pv"
fresh.setAttribute("sandbox","allow-scripts allow-same-origin")
fresh.setAttribute("scrolling","no")
fresh.style.width="100%"
fresh.style.height="100%"
fresh.style.border="none"

old.replaceWith(fresh)

}

/* rotation */

function updateRotation(){

if(currentLayer){

layerTransforms[currentLayer].x=rotX.value
layerTransforms[currentLayer].y=rotY.value

renderLayers()

}else{

panel.style.transform=
`rotateX(${rotX.value}deg) rotateY(${rotY.value}deg)`

}

}

rotX.oninput=updateRotation
rotY.oninput=updateRotation

/* double tap mode switching */

let tapTimer=null
let codeMode=false

function toggleCodeMode(){

codeMode=!codeMode

if(codeMode){

codeEl.style.display="block"
panel.style.display="none"
bar.classList.add("codeMode")

}else{

codeEl.style.display="none"
panel.style.display="flex"
bar.classList.remove("codeMode")

}

}

wrap.addEventListener("click",()=>{

if(tapTimer){

clearTimeout(tapTimer)
tapTimer=null
toggleCodeMode()

}else{

tapTimer=setTimeout(()=>tapTimer=null,250)

}

})

codeEl.addEventListener("click",()=>{

if(tapTimer){

clearTimeout(tapTimer)
tapTimer=null
toggleCodeMode()

}else{

tapTimer=setTimeout(()=>tapTimer=null,250)

}

})

document.getElementById("paste").onclick=
()=>paste().catch(()=>alert("paste blocked"))

document.getElementById("run").onclick=run
document.getElementById("clear").onclick=clearLayer
document.getElementById("kill").onclick=kill

</script>

</body>
</html>
